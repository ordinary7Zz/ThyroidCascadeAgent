# ThyroidCascadeAgent 统一配置
# API key 从环境变量 DASHSCOPE_API_KEY 读取，不在此处硬编码
# 模型通过 type 字段驱动工厂创建，新增模型只需加 type + 写子类

# ===== 共享段 =====
shared:
  agent_llm:
    api_key_env: "DASHSCOPE_API_KEY"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model_name: "qwen2.5-32b-instruct"
    temperature: 0.3
    max_tokens: 1024

# ===== 分割段 =====
segmentation:
  models:
    - type: "dinov3_unet"
      name: "all_datasets"
      model_path: "../my_Thyroid_Infer/infer_dinov3_unet/checkpoints/Nodule/dino_unet_train_dataset_4_epoch_50.pth"
      input_size: [224, 224]
      threshold: 0.5
    # ===== TransUNet =====
    - type: "transunet"
      name: "transunet_all_datasets"
      model_path: "../my_Thyroid_Infer/infer_transunet/checkpoints/Nodule/epoch_49.pth"
      num_classes: 2
      vit_name: "R50-ViT-B_16"
      img_size: 224
      n_skip: 3
      threshold: 0.5
      infer_root: "../my_Thyroid_Infer/infer_transunet"
    # ===== UltraFedFM =====
    - type: "ultrafedfm"
      name: "ultrafedfm_all_datasets"
      model_path: "../my_Thyroid_Infer/infer_ultrafedfm/checkpoints/epoch_bestDice.pth"
      img_size: 224
      threshold: 0.5
      infer_root: "../my_Thyroid_Infer/infer_ultrafedfm"
    # ===== MedSegX (SAM + MoE Adapter) =====
    - type: "medsegx"
      name: "medsegx_thyroid"
      model_path: "../my_Thyroid_Infer/infer_medsegx/checkpoints/Nodule/model_best.pth"
      sam_checkpoint: "../my_Thyroid_Infer/infer_medsegx/pretrained_models/SAM/sam_vit_b_01ec64.pth"
      sam_model_type: "vit_b"
      task_name: "US_ThyroidNodule"
      img_size: 256
      threshold: 0.5
      bottleneck_dim: 16
      embedding_dim: 16
      expert_num: 4
      infer_root: "../my_Thyroid_Infer/infer_medsegx"
    # ===== MedSAM2 (SAM2 Video Predictor) =====
    - type: "medsam2"
      name: "medsam2_thyroid"
      model_path: "../my_Thyroid_Infer/infer_medsam2/checkpoints/Nodule/checkpoint_15.pt"
      model_cfg: "../my_Thyroid_Infer/infer_medsam2/sam2/configs/sam2.1_hiera_t512.yaml"
      img_size: 1024
      threshold: 0.5
      infer_root: "../my_Thyroid_Infer/infer_medsam2"
  agent:
    enable_agent: false             # 分割 Agent 是否调 LLM（false 时用静态规则）
    include_disagreement_metrics_in_prompt: true
    pre_filter:
      cosine_threshold: 0.8          # 特征向量 cosine 相似性阈值（设 0 可关闭）
      prob_outlier_threshold: 0.4    # 分类置信度离群阈值（设 1 可关闭）
      min_keep: 3                    # 最少保留模型数（安全阀）
    ensemble:
      enabled: true
      top_k: 1
      method: "weighted_average"
      threshold: 0.5

# ===== 分类段 =====
classification:
  models:
    - type: "dinov3_unet_multitask"
      name: "all_datasets"
      model_path: "../my_Thyroid_Infer/infer_dinov3_unet_multitask/checkpoints/BM_2cls/dino_unet_gamtl_train_multitask_dataset_3_epoch_50.pth"
      use_tirads: false
    - type: "autogluon_radiomics"
      name: "autogluon_radiomics"
      model_dir: "../my_Thyroid_Infer/infer_autogluon/checkpoints/binary"
    # ===== MedSigLIP (SigLIP ViT 分类) =====
    - type: "medsiglip"
      name: "medsiglip_binary"
      model_path: "../my_Thyroid_Infer/infer_medsiglip/checkpoints/BM_2cls/best_model.pt"
      pretrained_model_path: "../my_Thyroid_Infer/infer_medsiglip/pretrained_models/medsiglip-448"
      num_classes: 2
      img_size: 448
      dropout: 0.1
    # ===== BiomedCLIP (open_clip ViT 分类) =====
    - type: "biomedclip"
      name: "biomedclip_binary"
      model_path: "../my_Thyroid_Infer/infer_biomedclip/checkpoints/BM_2cls/best_model.pth"
      model_dir: "../my_Thyroid_Infer/infer_biomedclip/pretrained_models/biomedclip"
      num_classes: 2
      img_size: 224
      dropout: 0.3
  agent:
    enable_agent: false
    top_k: 5
    consensus_min_confidence: 0.6  # Step 1 独立分类模型共识所需的最低置信度

# ===== Radiomics 裁判段 =====
radiomics_judge:
  enabled: true
  model_dir: "/mnt/wangbd8/workspace/ThyroidAgent/dino_unet_multitask/pyradiomics_train/binary_class/BM/outputs/models/BM_dataset3_gt/BM"
  top_k_features: 5

# ===== Pipeline 段 =====
pipeline:
  data:
    image_input: "/mnt/wangbd8/workspace/DataSets/ThyroidAgent/train_val_test/sample/images"
    mask_input: "/mnt/wangbd8/workspace/DataSets/ThyroidAgent/train_val_test/sample/masks"               # 仅 run_cls.py 用（外部 mask 目录）
    gt_mask_dir: "/mnt/wangbd8/workspace/DataSets/ThyroidAgent/train_val_test/sample/masks"
    label_file: "/mnt/wangbd8/workspace/DataSets/ThyroidAgent/train_val_test/sample/sample_test_label.json"
    device_info: ["GE Logiq E9", "GE S7"]
    start_index: 0
    max_images: null
  output:
    output_dir: "output/pipeline_run"
    save_masks: false
