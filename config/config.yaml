# ThyroidCascadeAgent 统一配置
# API key 从环境变量 DASHSCOPE_API_KEY 读取，不在此处硬编码
# 模型通过 type 字段驱动工厂创建，新增模型只需加 type + 写子类

# ===== 共享段 =====
shared:
  agent_llm:
    api_key_env: "DASHSCOPE_API_KEY"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model_name: "qwen2.5-32b-instruct"
    temperature: 0.3
    max_tokens: 1024

# ===== 分割段 =====
segmentation:
  models:
    - type: "dinov3_unet"
      name: "all_datasets"
      model_path: "weights/seg/all_datasets/dino_unet_train_all_datasets_epoch_40.pth"
      input_size: [224, 224]
      threshold: 0.5
      base_dataset_performance:
        TN3K: {dice: 0.8454, hd95: 11.7064, ece: 0.0208}
        DDTI: {dice: 0.8427, hd95: 10.6699, ece: 0.0305}
        ThyroidXL: {dice: 0.8793, hd95: 5.3659, ece: 0.0118}
        PKTN: {dice: 0.8395, hd95: 9.6710, ece: 0.0162}
        TN5K: {dice: 0.8297, hd95: 8.5319, ece: 0.0105}
        CineClip: {dice: 0.9688, hd95: 0.4345, ece: 0.0021}
      dataset_info:
        base_datasets: ["TN3K", "ThyroidXL", "PKTN", "DDTI", "TN5K", "CineClip"]
        dataset_size: 39604
    # ===== TransUNet =====
    - type: "transunet"
      name: "transunet_all_datasets"
      model_path: "TODO: weights/seg/transunet/all_datasets.pth"
      num_classes: 2
      vit_name: "R50-ViT-B_16"
      img_size: 224
      n_skip: 3
      threshold: 0.5
      infer_root: "TODO: /path/to/infer_transunet"
      base_dataset_performance: {}      # TODO: 填各数据集 dice/hd95/ece
      dataset_info:
        base_datasets: ["TODO"]         # TODO: 填训练数据集
        dataset_size: 0                 # TODO: 填训练样本数
    # ===== UltraFedFM =====
    - type: "ultrafedfm"
      name: "ultrafedfm_all_datasets"
      model_path: "TODO: weights/seg/ultrafedfm/all_datasets.pth"
      img_size: 224
      threshold: 0.5
      infer_root: "TODO: /path/to/infer_ultrafedfm"
      base_dataset_performance: {}
      dataset_info:
        base_datasets: ["TODO"]
        dataset_size: 0
    # ===== MedSegX (SAM + MoE Adapter) =====
    - type: "medsegx"
      name: "medsegx_thyroid"
      model_path: "TODO: weights/seg/medsegx/thyroid.pth"
      sam_checkpoint: "TODO: weights/pretrained/sam_vit_b_01ec64.pth"
      sam_model_type: "vit_b"
      task_name: "US_ThyroidNodule"
      img_size: 256
      threshold: 0.5
      bottleneck_dim: 16
      embedding_dim: 16
      expert_num: 4
      infer_root: "TODO: /path/to/infer_medsegx"
      base_dataset_performance: {}
      dataset_info:
        base_datasets: ["TODO"]
        dataset_size: 0
    # ===== MedSAM2 (SAM2 Video Predictor) =====
    - type: "medsam2"
      name: "medsam2_thyroid"
      model_path: "TODO: weights/seg/medsam2/thyroid.pth"
      model_cfg: "sam2_hiera_b+.yaml"
      img_size: 1024
      threshold: 0.5
      infer_root: "TODO: /path/to/infer_medsam2"
      base_dataset_performance: {}
      dataset_info:
        base_datasets: ["TODO"]
        dataset_size: 0
  agent:
    use_agent_selection: true
    include_disagreement_metrics_in_prompt: true
    pre_filter:
      cosine_threshold: 0.8          # 特征向量 cosine 相似性阈值（设 0 可关闭）
      prob_outlier_threshold: 0.4    # 分类置信度离群阈值（设 1 可关闭）
      min_keep: 3                    # 最少保留模型数（安全阀）
    ensemble:
      enabled: true
      top_k: 1
      method: "weighted_average"
      threshold: 0.5

# ===== 分类段 =====
classification:
  models:
    - type: "dinov3_unet_multitask"
      name: "all_datasets"
      model_path: "weights/cls/all_datasets/dino_unet_train_all_datasets_epoch_40.pth"
      use_tirads: false
      base_dataset_performance:
        DDTI: {accuracy: 0.8298, auc: 0.7533, ece: 0.1601}
        TN3K: {accuracy: 0.6891, auc: 0.7685, ece: 0.2442}
        ThyroidXL: {accuracy: 0.8491, auc: 0.9301, ece: 0.1089}
        TN5K: {accuracy: 0.9132, auc: 0.9545, ece: 0.0626}
        CineClip: {accuracy: 0.9997, auc: 1.0000, ece: 0.0002}
      dataset_info:
        base_datasets: ["TN3K", "ThyroidXL", "TN5K", "CineClip"]
        dataset_size: 31304
    - type: "autogluon_radiomics"
      name: "autogluon_radiomics"
      model_dir: "weights/cls/autogluon_model"
      base_dataset_performance:
        TN3K: {accuracy: 0.6970, auc: 0.7214}
        ThyroidXL: {accuracy: 0.9186, auc: 0.9726}
        TN5K: {accuracy: 0.858, auc: 0.8664}
      dataset_info:
        base_datasets: ["TN3K", "ThyroidXL", "TN5K"]
        dataset_size: 15109
    # ===== MedSigLIP (SigLIP ViT 分类) =====
    - type: "medsiglip"
      name: "medsiglip_binary"
      model_path: "TODO: weights/cls/medsiglip/binary.pt"
      pretrained_model_path: "TODO: weights/pretrained/medsiglip-448"
      num_classes: 2
      img_size: 448
      dropout: 0.1
      base_dataset_performance: {}      # TODO: 填各数据集 accuracy/auc/ece
      dataset_info:
        base_datasets: ["TODO"]
        dataset_size: 0
    # ===== BiomedCLIP (open_clip ViT 分类) =====
    - type: "biomedclip"
      name: "biomedclip_binary"
      model_path: "TODO: weights/cls/biomedclip/binary.pth"
      model_dir: "TODO: weights/pretrained/biomedclip/"
      num_classes: 2
      img_size: 224
      dropout: 0.3
      base_dataset_performance: {}
      dataset_info:
        base_datasets: ["TODO"]
        dataset_size: 0
  calibration:
    enabled: false
    artifacts_dir: "classification/calibration/artifacts"
  agent:
    enable_agent: true
    top_k: 5

# ===== Radiomics 裁判段 =====
radiomics_judge:
  enabled: true
  model_dir: "weights/judge/autogluon_gt_trained"
  top_k_features: 5
  shap_reference_path: "weights/judge/shap_reference.json"
  trigger_volume_cv: null

# ===== Pipeline 段 =====
pipeline:
  seg_output_to_cls_mask: true
  data:
    image_input: "/path/to/images"
    gt_mask_dir: null
    label_file: null
    device_info: ["GE Logiq E9", "GE S7"]
    start_index: 0
    max_images: null
  output:
    output_dir: "output/pipeline_run"
    save_masks: true
    save_json: true
