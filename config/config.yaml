        TN3K: {accuracy: 0.7340, auc: 0.8200, ece: 0.2241}
        ThyroidXL: {accuracy: 0.7275, auc: 0.8996, ece: 0.2593}
        TN5K: {accuracy: 0.8986, auc: 0.9526, ece: 0.0812}
        CineClip: {accuracy: 0.7309, auc: 0.7536, ece: 0.2465}
      dataset_info:
