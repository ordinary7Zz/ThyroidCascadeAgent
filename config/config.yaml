        dataset_size: 3400
    - type: "dinov3_unet_multitask"
      name: "ThyroidXL"
      model_path: "weights/cls/ThyroidXL/dino_unet_train_multitask_ThyroidXL_epoch_50.pth"
      use_tirads: false
      base_dataset_performance:
        DDTI: {accuracy: 0.8452, auc: 0.7093, ece: 0.1469}
        TN3K: {accuracy: 0.7561, auc: 0.8161, ece: 0.2254}
