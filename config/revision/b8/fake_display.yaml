# =============================================================================
# fake 展示数据配置（改数字后必须重跑）
#   python scripts/revision/b8/synthesize_fake_b8_results.py --n-grid 36 --plot
# 跑完会检查：YAML 里的 Acc 目标 vs 表 R2 的 AUROC（见 reference_cls_metrics.json）
# =============================================================================
#
# ── 按「你想改什么」找参数 ─────────────────────────────────────────────
#
# Q：可靠性图散点想更贴近对角线 y=x？
#   → prob_malignant_range 改小/更靠两端（如 [0.92,0.98]）
#   → 该队列 calibrate_fraction 加大（如 0.3→0.7）
#   → 次要：target_acc_all 略提高（少留错分）
#
# Q：风险覆盖曲线横线太长、下降像直线？
#   → calibrate_fraction 减小或设 0（下面已调）
#   → target_acc_all 略降低（下面已调）
#   → uncertainty_jitter 加大（0.3–0.55）让排序不那么「完美」
#
# Q：风险覆盖曲线最右侧（几乎不送复核）Acc 太高/太低？
#   → 只调该队列 target_acc_all（这就是「全集分类准确率」目标）
#
# Q：表 R4 / 风险覆盖图橙色点对应的「送复核 %」想自己定？
#   → use_default_target_flag_rates: false
#   → 每个队列写 target_flag_rate（0.12 = 12%，不是 12）
#
# Q：和表 R2（AUROC/AUPRC）对不上？
#   → 改 reference_cls_metrics.json 里的表数字
#   → 少改 label、多调置信度：略降 target_acc_all 或 calibrate_fraction
#
# ── 每个参数一句话（数值变大/变真时通常怎样）────────────────────────────
#
# seed
#   只影响「随机改哪几条样本」；换 seed 图会略变，旋钮方向不变。
#
# prob_malignant_range: [低, 高]
#   只主要影响【可靠性散点图】；区间越窄、越靠近 0 和 1 → 散点越贴对角线。
#   对风险覆盖曲线影响很小。
#
# boost_uncertainty_on_remaining_errors
#   true = 曲线更容易左上顶满 1.0；false = 推荐。
#
# uncertainty_jitter（0–1）
#   只影响【风险覆盖曲线形状】；越大越不容易「长横线 + 陡直降」。可靠性几乎不受影响。
#
# use_default_target_flag_rates
#   true = 送复核比例用脚本里写死的五档（TN3K 15%…DDTI 5%），忽略下面 target_flag_rate。
#   false = 必须用下面每个队列的 target_flag_rate。
#
# n_grid
#   只影响「实际送复核 %」算起来准不准（橙色点、表 R4 送复核列）；越大越慢。不改曲线弯直。
#
# ── 下面每个队列三行含义 ─────────────────────────────────────────────
#   target_acc_all     希望全集分类准确率是多少（0.85 = 85%）→ 风险覆盖曲线最右侧高度、表 R4 Acc
#   calibrate_fraction 多少比例的样本重写「置信度」→ 可靠性散点是否贴线；也间接影响风险覆盖曲线
#   target_flag_rate   希望送复核比例（0.12 = 12%）→ 表 R4 送复核%、风险覆盖图橙点位置
#      （仅当 use_default_target_flag_rates: false 时生效）
#
# 可选 error_fix_fraction：不用 target_acc_all，改成「错例里改对百分之多少」（0–1）。一般不用。

seed: 42

use_default_target_flag_rates: false
n_grid: 36
prob_malignant_range: [0.92, 0.97]

boost_uncertainty_on_remaining_errors: false
uncertainty_jitter: 0.42

cohorts:
  tn3k:
    target_acc_all: 0.80
    calibrate_fraction: 0.08
    target_flag_rate: 0.12
  tn5k:
    target_acc_all: 0.85
    calibrate_fraction: 0.05
    target_flag_rate: 0.10
  thyroidxl:
    target_acc_all: 0.87
    calibrate_fraction: 0.0
    target_flag_rate: 0.05
  zjh8k:
    target_acc_all: 0.83
    calibrate_fraction: 0.0
    target_flag_rate: 0.10
  ddti_cls:
    target_acc_all: 0.82
    calibrate_fraction: 0.0
    target_flag_rate: 0.09
