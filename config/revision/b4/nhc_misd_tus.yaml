# B4 汇总；L3/B-c 需 B3 llm 目录存在后再 build_b4_tables.py。
pipeline:
  ablation_b4:
    dataset_id: nhc_misd_tus
    b3_root: output/ablation/b3/nhc_misd_tus
    l2_b3_mode: soft_voting
    l3_b3_mode: llm
    s4_replica_b3_mode: llm
    l1_metrics: artifacts/b4_l1_nhc_misd_tus.json
    reference_manifest: output/ablation/b3/nhc_misd_tus/soft_voting/intermediate_manifest.json
    pathb:
      b_a_b3_mode: soft_voting
      b_b_b3_mode: path_b_autogluon
      b_b_metrics_dir: output/ablation/b4/nhc_misd_tus/path_b_autogluon
      b_c_b3_mode: llm
  output:
    output_dir: output/ablation/b4/nhc_misd_tus
