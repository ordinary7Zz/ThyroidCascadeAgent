# B4 L1 单专家外测；生成: scripts/generate_ablation_configs.py
# 跑数: python scripts/revision/b4/run_l1_cohort.py --cohort <id>
shared:
  agent_llm:
    api_key_env: DASHSCOPE_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_name: qwen3.7-flash
    temperature: 0.3
    max_tokens: 768
    enable_thinking: false
segmentation:
  models:
  - type: dinov3_unet
    name: all_datasets
    model_path: ../Segmentation_Agent/weights/all_datasets/dino_unet_train_all_datasets_epoch_40.pth
    input_size:
    - 224
    - 224
    threshold: 0.5
  agent:
    enable_agent: false
    routing_mode: static_rule
    include_disagreement_metrics_in_prompt: false
    pre_filter:
      cosine_threshold: 0.0
      prob_outlier_threshold: 1.0
      min_keep: 1
    ensemble:
      enabled: true
      top_k: 1
      method: weighted_average
      threshold: 0.5
classification:
  models:
  - type: dinov3_unet_multitask
    name: all_datasets
    model_path: ../Classification_Agent/weights/all_datasets/dino_unet_train_all_datasets_epoch_40.pth
    use_tirads: false
  agent:
    enable_agent: false
    routing_mode: best_single
    top_k: 1
    consensus_min_confidence: 0.0
radiomics_judge:
  enabled: false
pipeline:
  preload_workers: 4
  run_segmentation: true
  run_classification: true
  log_routing: false
  data:
    image_input: /mnt/wangbd8/workspace/DataSets/ThyroidAgent/train_val_test/TN3K/test/images
    gt_mask_dir: /mnt/wangbd8/workspace/DataSets/ThyroidAgent/train_val_test/TN3K/test/masks
    label_file: /mnt/wangbd8/workspace/DataSets/ThyroidAgent/train_val_test/TN3K/test/TN3K_test_label.json
    label_key: malignancy
    device_info:
    - GE Logiq E9
    - GE S7
    input_data_info:
      dataset_name: tn3k
      split: test
    start_index: 0
    max_images: null
  output:
    output_dir: output/ablation/l1/tn3k/run1
  ablation_b4:
    dataset_id: tn3k
    layer: L1
